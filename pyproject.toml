[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "racfall"
version = "0.1.0"
description = "Risk-Adaptive Context-Aware Fall Verification: reproducible research starter"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
vision = ["ultralytics>=8.4", "opencv-python>=4.8", "torch>=2.2", "lap>=0.5.12"]
dev = ["pytest>=8"]

[project.scripts]
racfall = "racfall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
